{% extends "layouts/main_post_2026.html" %}
{% set globalNavSection = 'Manage requests' %}

{% block pageTitle %}
Choose benefit type
{% endblock %}

{% block content %}

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    {% include "includes/back.njk"%}


    <h1 class="govuk-heading-l">
      <span class="govuk-caption-l">Set an interest</span>
      Choose benefit type
    </h1>

   
    
    <form method="post">
      
      <div class="govuk-form-group">
        <fieldset class="govuk-fieldset">
          <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">
            <h1 class="govuk-fieldset__heading">
              Which benefit is this request for?
            </h1>
          </legend>
          <div class="govuk-radios" data-module="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="benefit" name="benefit" type="radio" value="Housing Benefit">
              <label class="govuk-label govuk-radios__label" for="benefit">
                Housing Benefit
              </label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="benefit-2" name="benefit" type="radio" value="Council Tax reduction">
              <label class="govuk-label govuk-radios__label" for="benefit-2">
                Council Tax reduction
              </label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="benefit-3" namebenefitwhereDoYouLive" type="radio" value="Other">
              <label class="govuk-label govuk-radios__label" for="benefit-3">
                Other
              </label>
            </div>
          </div>
        </fieldset>
      </div>

      <div class="govuk-form-group">
        <button type="submit" class="govuk-button">Continue</button>
      </div>
    
    </form>

    

  </div>
</div>



{% endblock %}
