{% extends "layouts/main_post_2026.html" %}
{% set globalNavSection = 'Manage requests' %}

{% block pageTitle %}
Enter a National Insurance number
{% endblock %}

{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    {% include "includes/back.njk"%}
    
    <h1 class="govuk-heading-l">
      <span class="govuk-caption-l">Unset an interest</span>
      Search for someone
    </h1>

   
    <form method="post">
      <div class="govuk-form-group">
        <h1 class="govuk-label-wrapper">
          <label class="govuk-label govuk-label--m" for="nino">
            Enter a National Insurance number
          </label>
        </h1>
        <p class="govuk-hint">For example, QQ 12 34 56 A</p>
        <input class="govuk-input  govuk-input--width-10" id="nino" name="nino" type="text">
      </div>
      <div class="govuk-form-group">
        <button type="submit" class="govuk-button">Search</button>
      </div>
    </form>


    

  </div>
</div>

{% endblock %}
